[package]
name = "skimrr-wasm-demo"
version = "0.1.0"
edition = "2021"
description = "Proof that skimrr-format opens a .skimrr in a browser, with no server involved."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

# Deliberately not wasm-bindgen. The exports below are a plain C ABI, so the only tool
# needed to build this is `cargo` and the only thing needed to run it is a browser —
# which makes it a proof about the format crate rather than about a toolchain.
[dependencies]
skimrr-format = { path = "../skimrr-format" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
