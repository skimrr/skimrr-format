# The module imports one function from its host — the system random number generator —
# and `wasm-ld` will not leave a symbol undefined unless told that is the intent. This is
# what turns `extern "C" { fn skimrr_random(..) }` into a genuine WebAssembly import
# instead of a link error.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=--import-undefined"]
