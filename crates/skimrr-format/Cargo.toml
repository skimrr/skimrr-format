[package]
name = "skimrr-format"
version = "0.1.0"
edition = "2021"
description = "The .skimrr portable project container: framing, compression and encryption."
license = "MIT"

# A library, not a linkable module. The browser proof is its own crate and is the thing
# that gets linked; keeping this one an rlib is what lets the host supply the random
# number generator by import — a cdylib has to resolve every symbol at link time, and
# there is no system RNG to resolve against inside WebAssembly.
[lib]
crate-type = ["rlib"]

# Every dependency here is pure Rust and builds for wasm32-unknown-unknown. That is a
# hard constraint, not a preference: the browser must run this exact code rather than a
# second implementation of the same format, and a C dependency would force one.
[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "stream"] }
ciborium = { version = "0.2", default-features = false }
miniz_oxide = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_bytes = { version = "0.11", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1", features = ["zeroize_derive"] }

# `custom` rather than `js`. The `js` feature reaches randomness through wasm-bindgen,
# which drags the whole binding machinery into a module that needs exactly one thing
# from its host — and a build that needs a toolchain is a worse proof than one that
# needs a browser. With `custom`, the compiled module has a single import: the system
# random number generator, supplied by the page. Nothing else crosses the boundary.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }
